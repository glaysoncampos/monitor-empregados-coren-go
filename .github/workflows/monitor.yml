name: Atualizar monitor de empregados

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    name: Buscar e processar relatorio
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar ferramentas
        run: pip install -r requirements.txt

      - name: Executar monitor
        run: python monitor.py

      - name: Salvar resultados
        run: |
          git config user.name "Monitor Automatico"
          git config user.email "actions@github.com"
          git add docs/dados.json docs/empregados.csv

          if git diff --cached --quiet; then
            echo "Nenhuma mudanca encontrada."
          else
            git commit -m "Atualizacao automatica dos empregados"
            git push
          fi
